map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # API accepts documents up to 5 MiB; allow multipart overhead.
    client_max_body_size 6m;
    location = / { return 302 /cabinet/; }
    location = /demo { return 302 /cabinet/; }
    location = /demo/ { return 302 /cabinet/; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
    }
    location = /openapi.json { proxy_pass http://api:8000; }
    location /docs { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
